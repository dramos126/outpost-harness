# node_modules rather than Plug'n'Play: vite is known-good under the classic layout and
# there is nothing here that PnP's stricter resolution would buy us.
nodeLinker: node-modules

# The package manager lives in the repo, not on the host. `node .yarn/releases/yarn-4.18.0.cjs`
# is a complete yarn on any box with node and nothing else installed — see docs/process/infra.md.
# Written by `yarn set version 4.18.0 --yarn-path`; the `--yarn-path` is what vendors the file
# rather than only rewriting `packageManager`.
yarnPath: .yarn/releases/yarn-4.18.0.cjs
